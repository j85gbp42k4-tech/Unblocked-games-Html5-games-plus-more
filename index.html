<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="A collection of HTML5 games you can play right in your browser.">
  <title>Game Hub | HTML5 Games</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #151922;
      --surface-hover: #1d2330;
      --border: #262d3b;
      --text: #f2f4f8;
      --muted: #8b93a7;
      --accent: #c6f432;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.25rem; }
    header { padding: 3rem 0 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .logo {
      width: 2.5rem; height: 2.5rem; border-radius: .75rem;
      background: var(--accent); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.25rem;
    }
    h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); max-width: 40rem; }
    .search { position: relative; max-width: 28rem; }
    .search input {
      width: 100%; padding: .85rem 1rem; border-radius: .75rem;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 1rem;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent; }
    .featured {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;
      background: linear-gradient(120deg, #1a2410, var(--surface));
      border: 1px solid #3a4a17;
    }
    .featured .label { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .featured h2 { font-size: 1.5rem; font-weight: 800; }
    .featured p { color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; padding: .75rem 1.5rem; border-radius: .75rem;
      background: var(--accent); color: var(--bg); font-weight: 700; text-decoration: none;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
    .meta h2 { font-size: 1.125rem; font-weight: 700; }
    .meta p { color: var(--muted); font-size: .875rem; }
    .grid {
      list-style: none;
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      padding-bottom: 4rem;
    }
    .card {
      display: flex; flex-direction: column; gap: .75rem; height: 100%;
      padding: .75rem; border-radius: 1rem; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--border);
      transition: background .15s, transform .15s, border-color .15s;
    }
    .card:hover { background: var(--surface-hover); border-color: #3a4357; transform: translateY(-2px); }
    .thumb {
      aspect-ratio: 4 / 3; border-radius: .6rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: rgba(255,255,255,.92);
      position: relative;
    }
    .badge {
      position: absolute; top: .4rem; left: .4rem;
      font-size: .65rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      background: var(--accent); color: var(--bg); padding: .1rem .45rem; border-radius: .35rem;
    }
    .name { font-weight: 600; font-size: .95rem; line-height: 1.3; }
    .empty { color: var(--muted); padding: 2rem 0 4rem; text-align: center; }
    footer { border-top: 1px solid var(--border); padding: 1.5rem 0; color: var(--muted); font-size: .875rem; }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">G</div>
      <span style="font-weight:700">Game Hub</span>
    </div>
    <div>
      <h1>Play <span>HTML5 games</span> right in your browser</h1>
      <p class="sub">No downloads. Pick a game and start playing.</p>
    </div>
    <div class="search">
      <label for="q" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search games</label>
      <input id="q" type="search" placeholder="Search games..." autocomplete="off">
    </div>
  </header>

  <main class="wrap">
    <section class="featured" aria-labelledby="featured-title">
      <div>
        <p class="label">New</p>
        <h2 id="featured-title">Among Us</h2>
        <p>Fix the ship, find the impostor, and don't get caught.</p>
      </div>
      <a class="btn" href="Amongus.html">Play now</a>
    </section>

    <div class="meta">
      <h2>All games</h2>
      <p id="count" aria-live="polite"></p>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No games match your search.</p>
  </main>

  <footer>
    <div class="wrap">Game Hub</div>
  </footer>

  <script>
    const games = [
      { name: "Among Us", file: "Amongus.html", isNew: true },
      { name: "1v1.LOL", file: "1v1.lol.html" },
      { name: "60 Seconds", file: "60seconds.html" },
      { name: "Angry Birds", file: "Angry birds.html" },
      { name: "Basketball Stars", file: "Basketballstars.html" },
      { name: "BitLife", file: "Bitlife.html" },
      { name: "Burrito Bison", file: "Burrito bison.html" },
      { name: "Calculator", file: "Calculator.html" },
      { name: "Cookie Clicker", file: "Cookie-clicker.html" },
      { name: "Crazy Cattle 3D", file: "Crazycattle3d.html" },
      { name: "Crossy Road", file: "Crossy road.html" },
      { name: "Drift Boss", file: "Drift boss.html" },
      { name: "FNAF", file: "FNAF.html" },
      { name: "Fireboy & Watergirl", file: "fire boy watergirl forest temple.html" },
      { name: "GN Math", file: "Gn math.html" },
      { name: "Hole.io", file: "Hole.io.html" },
      { name: "Knockoff Clash Royale", file: "Knockoffclashroyal.html" },
      { name: "LeBron the GOAT Games", file: "Lebron the goat games.html" },
      { name: "Minecraft", file: "Minecraft.html" },
      { name: "Offgrid Beta", file: "Offgrid BETA V1 1st.html" },
      { name: "Pixel Gun 3D", file: "Pixelgun3d.html" },
      { name: "PolyTrack", file: "Polytrack.html" },
      { name: "Retro Bowl", file: "Retro bowl.html" },
      { name: "Retro Bowl College", file: "retrobowcollegediton.html" },
      { name: "Rooftop Snipers", file: "Rooftopsnipers.html" },
      { name: "Silksong", file: "Silksong.html" },
      { name: "Slope", file: "Slope1.html" },
      { name: "Snake.io", file: "Snake.io" },
      { name: "Snow Rider 3D", file: "Snowrider3d.html" },
      { name: "Sonic", file: "Sonicd.html" },
      { name: "Steal a Brainrot", file: "Stealabrainrot.html" },
      { name: "Stickman Hook", file: "Stickmanhook.html" },
      { name: "Survivor.io", file: "Survivor.io.html" },
      { name: "Tetris", file: "Tetris.html" },
      { name: "Time Shooter 2", file: "timeshooter2.html" },
      { name: "Time Shooter 3", file: "timeshooter3.html" },
      { name: "Triple T Horror", file: "Triple t horror.html" },
      { name: "Undertale", file: "Undertale.html" },
      { name: "Vex", file: "Vex.html" },
      { name: "Web Dashers", file: "Webdashers.html" },
      { name: "Wordle Unlimited", file: "wordleunlimted.html" }
    ];

    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");
    const search = document.getElementById("q");

    function hue(str) {
      let h = 0;
      for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) % 360;
      return h;
    }

    function initials(name) {
      return name.replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    }

    function render(list) {
      grid.replaceChildren(...list.map(game => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "card";
        a.href = encodeURI(game.file);
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.setAttribute("aria-hidden", "true");
        const h = hue(game.name);
        thumb.style.background = `linear-gradient(135deg, hsl(${h} 65% 42%), hsl(${(h + 40) % 360} 70% 26%))`;
        thumb.textContent = initials(game.name);
        if (game.isNew) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "New";
          thumb.appendChild(badge);
        }
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = game.name;
        a.append(thumb, name);
        li.appendChild(a);
        return li;
      }));
      count.textContent = `${list.length} game${list.length === 1 ? "" : "s"}`;
      empty.hidden = list.length > 0;
    }

    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      render(q ? games.filter(g => g.name.toLowerCase().includes(q)) : games);
    });

    render(games);
  </script>
</body>
</html>
